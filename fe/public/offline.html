<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c0c0e" />
    <title>Connessione assente · Fantastiche</title>
    <style>
      @font-face {
        font-family: Inter;
        src: url('__PWA_FONT__') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #0c0c0e;
        color: #f4f4f5;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 360px;
        padding: 32px 24px;
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
      }
      h1 {
        font-size: 26px;
        margin: 28px 0 8px;
      }
      p {
        color: #aaaab3;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 14px 24px;
        border-radius: 8px;
        background: #c4a1ff;
        color: #181020;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #f4f4f5;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="Fantastiche" />
      <h1>Torniamo in campo appena sei online.</h1>
      <p>
        Controlla la connessione e riprova. Per partecipare all’asta e inviare
        offerte serve una connessione attiva.
      </p>
      <a href="">Riprova</a>
    </main>
  </body>
</html>
